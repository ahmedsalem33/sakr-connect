<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Sakr Connect Pay - {{ network_owner.name | default('شبكة الصقر') }}{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        navy: { royal: '#002366', dark: '#00163d', base: '#0f172a' },
                        gold: { main: '#D4AF37', light: '#eab308' },
                        sakr: { blue: '#8ECAE6' }
                    }
                }
            }
        }
    </script>

    <meta name="theme-color" content="#00163d">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #e2e8f0; -webkit-user-select: none; user-select: none; }
        .sakr-gradient { background: linear-gradient(135deg, #D4AF37 0%, #eab308 100%); }
        .sakr-text-gradient { background: linear-gradient(135deg, #D4AF37 0%, #eab308 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(0, 22, 61, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden selection:bg-gold-main/50">

    <div class="fixed top-0 left-1/2 transform -translate-x-1/2 w-full max-w-lg h-64 bg-gold-main/10 rounded-full blur-[100px] -z-10 pointer-events-none"></div>

    <header class="w-full glass-card border-b border-gold-main/30 px-4 py-4 flex items-center justify-center shadow-[0_10px_30px_rgba(0,0,0,0.4)] sticky top-0 z-50">
        <div class="flex flex-col items-center justify-center text-center gap-1">
            <h1 class="text-xl font-black text-[#D4AF37] tracking-widest uppercase">SAKR CONNECT PAY</h1>
            <span class="text-[10px] text-sakr-blue font-bold tracking-wider uppercase mb-2">النظام المتكامل لإدارة خوادم الراديوس</span>
            
            <div class="bg-navy-royal/50 px-6 py-1 rounded-full border border-gold-main/20">
                <span class="text-lg font-black sakr-text-gradient">صقر كونكت باي</span>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto p-4 flex flex-col relative z-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="w-full glass-card border-t border-gold-main/30 py-3.5 mt-auto z-10 text-center">
        <div class="flex flex-col items-center justify-center gap-1.5">
            <span class="text-[11px] text-sakr-blue font-bold tracking-wider uppercase">Powered by Sakr Connect Pay</span>
            <span class="text-[10px] text-slate-400 font-bold">وكالة صقر ميديا | م. أحمد سالم الملواني</span>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
