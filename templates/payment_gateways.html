{% extends "index.html" %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h2 class="text-2xl font-black text-white">💳 الإعدادات الشاملة (محلي ودولي)</h2>
        <p class="text-sm text-slate-400 mt-1">التحكم في بوابات الدفع، عمولات المنصة، وتخصيص تجربة المستخدم</p>
    </div>
    <button type="submit" form="payment-settings-form" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-6 rounded-lg text-sm shadow-lg transition-all flex items-center gap-2">
        <span>💾</span> حفظ كل الإعدادات
    </button>
</div>

<form id="payment-settings-form" action="{{ url_for('settings.save_dynamic_settings') }}" method="POST" class="space-y-6">
    
    <div class="bg-[#0f172a] border border-slate-800 rounded-xl p-6 shadow-xl relative">
        <div class="absolute top-0 right-0 w-1 h-full bg-rose-500"></div>
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">📱 المحافظ الإلكترونية (مصر)</h3>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" name="wallet_active" class="sr-only peer" {% if payment_config.wallet_active %}checked{% endif %}>
                <div class="w-11 h-6 bg-slate-700 rounded-full peer peer-checked:bg-rose-500"></div>
            </label>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">رقم المحفظة (الاستقبال)</label>
                <input type="text" name="wallet_number" value="{{ payment_config.wallet_number }}" class="w-full bg-[#0b111e] border border-slate-700 rounded-lg px-4 py-2 text-sm text-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">مفتاح الربط الآلي (Secret Token)</label>
                <input type="text" name="webhook_secret" value="{{ payment_config.webhook_secret }}" class="w-full bg-[#0b111e] border border-slate-700 rounded-lg px-4 py-2 text-sm text-emerald-400 font-mono" readonly onclick="this.select()">
            </div>
        </div>
    </div>

    <div class="bg-[#0f172a] border border-amber-900/30 rounded-xl p-6 shadow-xl relative">
        <div class="absolute top-0 right-0 w-1 h-full bg-amber-500"></div>
        <h3 class="text-lg font-bold text-white mb-6 flex items-center gap-2">💰 عمولة صقر ميديا (SaaS)</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">نوع العمولة</label>
                <select name="commission_type" class="w-full bg-[#0b111e] border border-slate-700 rounded-lg px-4 py-2 text-sm text-white">
                    <option value="percentage" {% if commission_config.type == 'percentage' %}selected{% endif %}>نسبة مئوية (%)</option>
                    <option value="fixed" {% if commission_config.type == 'fixed' %}selected{% endif %}>مبلغ ثابت (EGP)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">القيمة</label>
                <input type="number" step="0.1" name="commission_value" value="{{ commission_config.value|default(0) }}" class="w-full bg-[#0b111e] border border-slate-700 rounded-lg px-4 py-2 text-sm text-white">
            </div>
        </div>
    </div>

    <div class="bg-[#0f172a] border border-blue-900/30 rounded-xl p-6 shadow-xl relative">
        <div class="absolute top-0 right-0 w-1 h-full bg-blue-500"></div>
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">🌐 بوابات الدفع الدولي (PayPal)</h3>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" name="paypal_active" class="sr-only peer" {% if paypal_config.active %}checked{% endif %}>
                <div class="w-11 h-6 bg-slate-700 rounded-full peer peer-checked:bg-blue-500"></div>
            </label>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">PayPal Client ID</label>
                <input type="text" name="paypal_client_id" value="{{ paypal_config.client_id }}" class="w-full bg-[#0b111e] border border-slate-700 rounded-lg px-4 py-2 text-sm text-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">PayPal Secret</label>
                <input type="password" name="paypal_secret" value="{{ paypal_config.secret }}" class="w-full bg-[#0b111e] border border-slate-700 rounded-lg px-4 py-2 text-sm text-white">
            </div>
        </div>
    </div>

    <div class="bg-[#0f172a] border border-slate-800 rounded-xl p-6 shadow-xl">
        <h3 class="text-lg font-bold text-white mb-6">🎨 تخصيص واجهة التطبيق</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">اسم التطبيق (Brand Name)</label>
                <input type="text" name="app_name" value="{{ app_config.app_name }}" class="w-full bg-[#0b111e] border border-slate-700 rounded-lg px-4 py-2 text-sm text-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2">اللون الأساسي (Primary Color)</label>
                <input type="color" name="app_primary_color" value="{{ app_config.app_primary_color }}" class="w-full h-[40px] bg-[#0b111e] border border-slate-700 rounded-lg cursor-pointer">
            </div>
        </div>
    </div>
</form>
{% endblock %}
