services:
  - type: web
    name: sakr-connect
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: SAKR_SECRET_KEY
        generateValue: true
      - key: VOUCHER_SALT
        generateValue: true
      - key: RADIUS_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
